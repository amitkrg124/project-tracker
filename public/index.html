<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Team Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Sign-in: pick who you are (and enter the team passcode if one is set) -->
  <section id="login" class="login" hidden>
    <div class="login-card">
      <div class="logo">✅</div>
      <h1>Team Tracker</h1>
      <p class="muted">Who's using this phone?</p>
      <div id="member-buttons" class="member-buttons"></div>
      <input id="passcode" type="password" inputmode="numeric" placeholder="Team passcode" hidden>
      <p id="login-error" class="error" hidden></p>
    </div>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <button id="back-btn" class="icon-btn" aria-label="Back" hidden>‹</button>
      <h1 id="view-title">Today</h1>
      <span id="sync" class="sync" title="Sync status">●</span>
      <button id="me-btn" class="avatar" aria-label="Switch user"></button>
    </header>

    <main>
      <!-- TODAY -->
      <section id="view-today" class="view">
        <div class="datebar">
          <button class="icon-btn" data-day="-1" aria-label="Previous day">‹</button>
          <button id="date-label" class="date-label"></button>
          <button class="icon-btn" data-day="1" aria-label="Next day">›</button>
        </div>

        <div class="summary card">
          <div class="summary-row"><strong id="summary-text"></strong><span id="summary-pct" class="muted"></span></div>
          <div class="bar"><span id="summary-bar"></span></div>
        </div>

        <div class="chips" id="who-filter"></div>
        <div class="chips">
          <button class="chip" data-sort="time">⏰ By time</button>
          <button class="chip" data-sort="priority">🔥 By priority</button>
        </div>

        <div id="task-list"></div>
      </section>

      <!-- PROJECTS -->
      <section id="view-projects" class="view" hidden>
        <div class="chips">
          <button class="chip" data-pfilter="open">Open</button>
          <button class="chip" data-pfilter="all">All</button>
          <button class="chip" data-pfilter="done">✅ Done</button>
        </div>
        <div id="project-list"></div>
      </section>

      <!-- PROJECT DETAIL -->
      <section id="view-project" class="view" hidden>
        <div id="project-detail"></div>
      </section>
    </main>

    <button id="fab" class="fab" aria-label="Add">+</button>

    <nav class="tabbar">
      <button data-tab="today" class="active"><span>☀️</span>Today</button>
      <button data-tab="projects"><span>📁</span>Projects</button>
    </nav>
  </div>

  <!-- Bottom sheet used for every add/edit form -->
  <dialog id="sheet" class="sheet">
    <form id="sheet-form" method="dialog">
      <div class="sheet-handle"></div>
      <h2 id="sheet-title"></h2>
      <div id="sheet-body"></div>
      <div class="sheet-actions">
        <button type="button" id="sheet-delete" class="btn danger" hidden>Delete</button>
        <button type="button" id="sheet-cancel" class="btn ghost">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
